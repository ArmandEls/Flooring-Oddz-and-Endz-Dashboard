services:
  - type: web
    name: team-dashboard
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: STOCK_LOSS_DAYS
        value: "180"
      - key: CIN7_ACCOUNT_ID
        sync: false
      - key: CIN7_APPLICATION_KEY
        sync: false
    disk:
      name: team-dashboard-data
      mountPath: /var/data
      sizeGB: 1
